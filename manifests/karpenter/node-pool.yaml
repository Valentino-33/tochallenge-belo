# NodePool para nodos stateless escalables por Karpenter.
# Apliar con: make addons-karpenter ENV=dev
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: stateless
spec:
  template:
    metadata:
      labels:
        role: stateless
        workload: stateless
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3a.medium", "m5.large", "m5a.large"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
  limits:
    cpu: 16
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30s
